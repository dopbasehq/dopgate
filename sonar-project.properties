# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
sonar.organization=dopbasehq
sonar.projectKey=dopbasehq_dopgate

# The server, the admin console, the release scripts and the workflows. The
# docs site and the SQL migrations are left out.
sonar.sources=app/src,ui/src,scripts,.github/workflows
sonar.tests=app/tests,ui/src,scripts

# ui/src and scripts hold tests next to the code, so the test files are taken
# out of the sources and counted as tests instead.
sonar.exclusions=ui/src/**/*.test.ts,ui/src/tests/**,scripts/**/*.test.mjs
sonar.test.inclusions=app/tests/**,ui/src/**/*.test.ts,ui/src/tests/**,scripts/**/*.test.mjs

# The crate is not at the repository root, where the scanner looks for it.
sonar.rust.cargo.manifestPaths=app/Cargo.toml

# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
sonar.organization=dopbase
sonar.projectKey=dopbasehq_dopgate

# SonarQube Cloud analyses the whole repository and picks out test files by
# name, so there is no list of sources or tests here. The docs site is left
# out. So are the migrations: Sonar reads them as PL/SQL and can't parse the
# PostgreSQL in them. The e2e folder is test tooling: its harness holds test
# passwords and a fake leaked password list keyed by SHA-1.
sonar.exclusions=docs/**,app/migrations/**,e2e/**,scripts/**

# No coverage report is sent yet, so every file is left out of the coverage
# figures. Otherwise Sonar counts 0% and the quality gate fails on it. Remove
# this line once the workflow uploads coverage.
sonar.coverage.exclusions=**/*

# Tailwind v4 nests @media inside @utility, which is valid CSS nesting that
# Sonar's CSS parser reads as a declaration out of place.
sonar.issue.ignore.multicriteria=tailwind,dginput,pwnedsha1
sonar.issue.ignore.multicriteria.tailwind.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.tailwind.resourceKey=ui/src/style.css

# Sonar accepts autocomplete="name" only on a native input, textarea or
# select, and doesn't know that DgInput renders one. The pages only use the
# Dg components, so the rule has nothing real to check there.
sonar.issue.ignore.multicriteria.dginput.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.dginput.resourceKey=ui/src/pages/**/*.vue

# The Pwned Passwords range API is keyed by SHA-1: a lookup sends the first
# five characters of the password's SHA-1 hash, so no other algorithm works.
# Nothing is protected by this hash. Stored passwords are hashed with Argon2.
sonar.issue.ignore.multicriteria.pwnedsha1.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.pwnedsha1.resourceKey=app/src/services/leaked_passwords.rs

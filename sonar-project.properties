# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
sonar.organization=dopbase
sonar.projectKey=dopbasehq_dopgate

# SonarQube Cloud analyses the whole repository and picks out test files by
# name, so there is no list of sources or tests here. The docs site is left
# out. So are the migrations: Sonar reads them as PL/SQL and can't parse the
# PostgreSQL in them.
sonar.exclusions=docs/**,app/migrations/**

# No coverage report is sent yet, so every file is left out of the coverage
# figures. Otherwise Sonar counts 0% and the quality gate fails on it. Remove
# this line once the workflow uploads coverage.
sonar.coverage.exclusions=**/*

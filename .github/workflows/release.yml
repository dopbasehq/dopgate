name: Release

# A version tag on main (0.1.0, not v0.1.0) builds the binaries, checks them,
# publishes a GitHub release with the notes from CHANGELOG.md, then pushes a
# multi-arch image to Docker Hub. A manual run does everything but publish
# and push, for a dry run before tagging.
#
# Pushing to Docker Hub needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# secrets. The token needs read and write access to DOCKER_IMAGE only.
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"
  CARGO_TERM_COLOR: always
  DOCKER_IMAGE: dopbase/dopgate
  RUST_VERSION: "1.98.0"

jobs:
  prepare:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only for `cargo metadata` in validate-source.sh. The unit tests, lints
      # and format checks ran in CI on the release pull request.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version=$(jq -r '.version' package.json)
          fi
          bash scripts/release/validate-source.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # main only moves through pull requests that passed CI, so a tag on any
      # other commit would publish code that was never tested.
      - name: Check the tag is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not a commit on main" >&2
            exit 1
          fi

      # The Docker image takes the latest tag only when this is the highest
      # version, so a patch to an older line never moves it back.
      - name: Check whether this is the latest version
        id: latest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          newest=$( { git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$RELEASE_VERSION"; } | sort -V | tail -n 1)
          if [[ "$newest" == "$RELEASE_VERSION" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Build admin console
        working-directory: ui
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Upload admin console
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ui
          path: ui/dist/
          if-no-files-found: error
          retention-days: 1

      # The first release has no earlier tag, so its notes link to the commit
      # history instead of a comparison.
      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(node scripts/github-templates.mjs previous-version \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}")"
          args=(
            --version "${RELEASE_VERSION}"
            --repository "${GITHUB_REPOSITORY}"
            --output release-notes.md
          )
          if [[ -n "$previous_version" ]]; then
            args+=(--previous-version "$previous_version")
          fi
          node scripts/github-templates.mjs render-release "${args[@]}"
          test -s release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.asset_arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
          # Cross-compiled on Apple Silicon, which builds about three times
          # faster than the Intel runner. The binary then runs under Rosetta.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      ASSET_OS: ${{ matrix.asset_os }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_VERSION}"

      # No Cargo cache here: a tag run can only read caches saved on its own
      # tag or on main, and nothing saves a release build there.
      - name: Install musl compiler
        if: matrix.asset_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Download admin console
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ui
          path: ui/dist/

      - name: Build release binary
        shell: bash
        run: bash scripts/release/build-binary.sh "$RELEASE_TARGET"

      # There are no e2e suites yet, so check that every binary at least
      # starts and reports the release version. darwin amd64 runs under
      # Rosetta here; the others run on their own platform.
      - name: Check the binary runs
        shell: bash
        run: |
          set -euo pipefail
          expected="dopgate $RELEASE_VERSION"
          actual=$("app/target/$RELEASE_TARGET/release/dopgate" --version)
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected $expected, got: $actual" >&2
            exit 1
          fi

      - name: Package release archive
        shell: bash
        run: bash scripts/release/package-archive.sh "app/target/$RELEASE_TARGET/release/dopgate" "$RELEASE_VERSION" "$ASSET_OS" "$ASSET_ARCH" "$GITHUB_WORKSPACE"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dopgate_*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-*
          path: release/
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release/
      - name: Verify archives and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/verify-assets.sh "$RELEASE_VERSION" release
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/publish.sh "$RELEASE_VERSION" release

  # Runs after the GitHub release so the image never ships ahead of it. A
  # manual run builds both architectures and tests the image without pushing.
  docker:
    name: Publish Docker image
    needs: [prepare, verify, publish]
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_LATEST: ${{ needs.prepare.outputs.latest }}
      PUSH_IMAGE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release/

      # The image copies the verified linux binaries instead of compiling
      # them again.
      - name: Prepare image context
        run: bash scripts/release/prepare-image.sh "$RELEASE_VERSION" release "$RUNNER_TEMP/image"

      - name: Choose image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags=("$DOCKER_IMAGE:$RELEASE_VERSION" "$DOCKER_IMAGE:${RELEASE_VERSION%.*}")
          if [[ "$RELEASE_LATEST" == true ]]; then
            tags+=("$DOCKER_IMAGE:latest")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          platforms: linux/amd64
          load: true
          push: false
          tags: dopgate:release-test

      - name: Check the image runs
        shell: bash
        run: |
          set -euo pipefail
          expected="dopgate $RELEASE_VERSION"
          actual=$(docker run --rm dopgate:release-test --version)
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected $expected, got: $actual" >&2
            exit 1
          fi
          user=$(docker image inspect --format '{{.Config.User}}' dopgate:release-test)
          if [[ "$user" != nonroot ]]; then
            echo "Expected the image to run as nonroot, got: $user" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

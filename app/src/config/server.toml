# dopgate server configuration
#
# Uncomment a setting to change it.
# Priority: CLI options > environment variables > this file > defaults.
# Restart the server after editing this file.

# Configuration schema version. Supported value: 1.
# version = 1

# Network interface to listen on.
# Default: "127.0.0.1" (local connections only).
# Examples: "localhost", "0.0.0.0", "192.168.1.20".
# Use "0.0.0.0" to listen on all IPv4 interfaces.
# Environment: DOPGATE_HOST
# host = "127.0.0.1"

# Port to listen on.
# Default: {{PORT}}. Example: 9000.
# Environment: DOPGATE_PORT
# port = {{PORT}}

# Address your apps and users reach this server on. Verification links,
# the JWT issuer, and single sign-on redirects are built from it.
# Accepts an absolute HTTP or HTTPS URL.
# Examples: "http://localhost:9000", "https://auth.example.com".
# When omitted, local binds use http://localhost:<port>.
# Network binds show http://SERVER_HOST:<port> until you set this.
# Environment: DOPGATE_PUBLIC_URL
# public_url = "{{PUBLIC_URL}}"

# Seconds to wait for in-flight requests during shutdown.
# Accepts: 1 to 300. Default: 10.
# Environment: DOPGATE_SHUTDOWN_GRACE_SECONDS
# shutdown_grace_seconds = 10

# Days to keep audit records. Older records are moved to the
# audit-archive directory in the data directory.
# Accepts: 1 or more. Remove this line to keep records forever.
# Environment: DOPGATE_AUDIT_RETENTION_DAYS
audit_retention_days = 365

# Reverse proxies allowed to report the client address. Rate limits and
# audit records use the connection's address unless it comes from one of
# these, in which case the X-Forwarded-For header is read instead. List
# only proxies you run: any address listed here can claim to be any client.
# Accepts: IP addresses or CIDR networks. Default: none.
# Environment: DOPGATE_TRUSTED_PROXIES (comma-separated)
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8"]

# Serve the Admin UI. The REST API stays available when disabled.
# Accepts: true or false. Default: false.
# Environment: DOPGATE_WEB_UI
# web_ui = false

# Serve Swagger UI at /api/docs and the OpenAPI document.
# Accepts: true or false. Default: true.
# Environment: DOPGATE_DOCS
# docs = true

# Outgoing email: verification codes, sign-in links, password resets.
# The SMTP settings an admin saves through the API take priority. This
# table is used while they have no host, and without a host here either,
# messages are written to the server log instead of being sent.
# Uncomment the table header and at least host and from_email to enable.
# [smtp]

# SMTP server host name or IP address, without a scheme or port.
# Examples: "smtp.example.com", "email-smtp.us-east-1.amazonaws.com".
# Environment: DOPGATE_SMTP_HOST
# host = "smtp.example.com"

# How the connection is encrypted.
# Accepts: "starttls" (usually port 587), "tls" (usually port 465), or
# "none" (only for a relay on the same host or a private network).
# Default: "starttls".
# Environment: DOPGATE_SMTP_SECURITY
# security = "starttls"

# Port of the SMTP server.
# Default: 587 for starttls, 465 for tls, 25 for none.
# Environment: DOPGATE_SMTP_PORT
# port = 587

# Login for the SMTP server. Leave both out if it accepts mail without one.
# This file is readable only by its owner, but you can keep the password
# out of it with the environment variable instead.
# Environment: DOPGATE_SMTP_USERNAME, DOPGATE_SMTP_PASSWORD
# username = "dopgate"
# password = "change-me"

# Sender address and display name. from_email is required with a host.
# Environment: DOPGATE_SMTP_FROM_EMAIL, DOPGATE_SMTP_FROM_NAME
# from_email = "no-reply@example.com"
# from_name = "Example"

# Master encryption key settings.
# Uncomment the table header before enabling settings below.
# [master_key]

# Key storage provider. Supported value: "file".
# provider = "file"

# Location of the master encryption key file.
# Default: master.key inside the selected data directory.
# Accepts an absolute path, a ~/ path, or a path relative
# to the directory where dopgate starts.
# Example: "/etc/dopgate/master.key".
# Environment: DOPGATE_MASTER_KEY_PATH
